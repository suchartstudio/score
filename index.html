<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium LED Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap');
        
        :root {
            --led-glow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Teko', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden; 
        }

        .led-text {
            text-shadow: var(--led-glow);
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            background: linear-gradient(90deg, #111, #333, #111);
            border-top: 2px solid #555;
            padding: 5px 0;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* 16:9 Display Aspect Ratio */
        .display-screen {
            aspect-ratio: 16 / 9;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            border: 4px solid #333;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8) inset;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ปรับแต่ง Scrollbar ใน Control Panel */
        .control-panel {
            height: calc(100vh - 50px);
            overflow-y: auto;
        }
        .control-panel::-webkit-scrollbar { width: 6px; }
        .control-panel::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Navigation -->
    <nav class="bg-gray-800 p-2 flex justify-between items-center h-[50px] shadow-lg border-b border-gray-700">
        <div class="font-bold text-2xl text-yellow-400 tracking-wider"><i class="fas fa-desktop"></i> STADIUM UI</div>
        <div class="flex gap-4">
            <button onclick="switchView('control')" class="px-4 py-1 bg-blue-600 hover:bg-blue-500 rounded text-lg transition">Control Panel</button>
            <button onclick="switchView('display')" class="px-4 py-1 bg-green-600 hover:bg-green-500 rounded text-lg transition">LED Display</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div id="app" class="w-full flex justify-center items-center h-[calc(100vh-50px)]"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // *** ใส่ Config Firebase ของคุณที่นี่ ***
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const matchRef = ref(db, 'currentMatch');

        // State เริ่มต้น
        let matchState = {
            competitionName: "CHAMPIONSHIP FINALS 2026",
            sport: "basketball", // basketball, football, futsal, volleyball, badminton, takraw
            period: 1,
            timer: { time: "10:00", shotClock: "24", running: false },
            home: { name: "HOME TEAM", score: 0, sets: 0, color: "#1d4ed8", fouls: 0, logo: "" },
            away: { name: "AWAY TEAM", score: 0, sets: 0, color: "#b91c1c", fouls: 0, logo: "" },
            marquee: { text: "WELCOME TO THE CHAMPIONSHIP FINALS | SPONSORED BY YOUR BRAND", visible: true },
        };

        let currentView = 'control'; // 'control' หรือ 'display'

        // ฟังก์ชันสำหรับสลับหน้าจอ
        window.switchView = (view) => {
            currentView = view;
            renderApp();
        };

        // ฟังก์ชันอัปเดต State Global
        window.updateState = (key, subKey, value) => {
            if(subKey) {
                matchState[key][subKey] = value;
            } else {
                matchState[key] = value;
            }
            syncToFirebase();
            renderApp();
        };

        window.adjustScore = (team, amount) => {
            matchState[team].score = Math.max(0, matchState[team].score + amount);
            syncToFirebase();
        };

        window.adjustSet = (team, amount) => {
            matchState[team].sets = Math.max(0, matchState[team].sets + amount);
            syncToFirebase();
        };

        // Firebase Sync
        function syncToFirebase() {
            set(matchRef, matchState);
        }

        onValue(matchRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                matchState = data;
                renderApp();
            }
        });

        // ==========================
        // RENDER LOGIC
        // ==========================
        function renderApp() {
            const appDiv = document.getElementById('app');
            if (currentView === 'control') {
                appDiv.innerHTML = renderControlPanel();
                appDiv.className = "w-full h-[calc(100vh-50px)]";
            } else {
                appDiv.innerHTML = renderDisplayPanel();
                appDiv.className = "w-full h-[calc(100vh-50px)] flex justify-center items-center bg-black p-4";
            }
            attachControlListeners();
        }

        // --- 1. CONTROL PANEL ---
        function renderControlPanel() {
            const sports = ['basketball', 'football', 'futsal', 'volleyball', 'badminton', 'takraw'];
            const isNoTimerSport = ['volleyball', 'badminton', 'takraw'].includes(matchState.sport);
            
            return `
            <div class="control-panel w-full p-4 bg-gray-900 text-sm">
                <!-- แถวบนสุด: กีฬา, ชื่อรายการ, Marquee -->
                <div class="grid grid-cols-12 gap-4 mb-4 bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-lg">
                    <div class="col-span-3 flex flex-col">
                        <label class="text-gray-400 text-xs font-bold mb-1">Sport Type</label>
                        <select id="input-sport" class="bg-gray-700 text-white rounded p-2 border border-gray-600 focus:border-blue-500 outline-none">
                            ${sports.map(s => `<option value="${s}" ${matchState.sport === s ? 'selected' : ''}>${s.toUpperCase()}</option>`).join('')}
                        </select>
                    </div>
                    <div class="col-span-4 flex flex-col">
                        <label class="text-gray-400 text-xs font-bold mb-1">Competition Name</label>
                        <input id="input-comp" type="text" class="bg-gray-700 text-white rounded p-2 border border-gray-600" value="${matchState.competitionName}">
                    </div>
                    <div class="col-span-5 flex flex-col">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-gray-400 text-xs font-bold">Marquee Text</label>
                            <label class="flex items-center gap-2 text-xs cursor-pointer bg-gray-700 px-2 py-1 rounded">
                                <input type="checkbox" id="input-marquee-visible" ${matchState.marquee.visible ? 'checked' : ''} class="w-4 h-4">
                                Show Marquee
                            </label>
                        </div>
                        <input id="input-marquee" type="text" class="bg-gray-700 text-white rounded p-2 border border-gray-600" value="${matchState.marquee.text}">
                    </div>
                </div>

                <!-- แถวกลาง: กระดานคะแนน Home / Center / Away -->
                <div class="grid grid-cols-3 gap-4 h-full">
                    
                    <!-- HOME TEAM -->
                    <div class="bg-gray-800 p-4 rounded-lg border-t-4 shadow-lg flex flex-col gap-4" style="border-color: ${matchState.home.color}">
                        <div class="text-center font-bold text-lg border-b border-gray-700 pb-2" style="color: ${matchState.home.color}">HOME TEAM</div>
                        <input id="input-home-name" type="text" class="bg-gray-700 rounded p-2 text-center font-bold text-xl" value="${matchState.home.name}">
                        <div class="flex items-center justify-between">
                            <label class="text-gray-400 text-xs font-bold">Team Color:</label>
                            <input id="input-home-color" type="color" value="${matchState.home.color}" class="bg-gray-700 h-8 w-16 cursor-pointer rounded">
                        </div>
                        <div class="flex-1 flex flex-col justify-center items-center bg-gray-900 rounded-lg p-4">
                            <div class="text-6xl font-bold mb-4">${matchState.home.score}</div>
                            <div class="flex gap-2 flex-wrap justify-center">
                                <button onclick="adjustScore('home', -1)" class="bg-red-900 hover:bg-red-700 px-4 py-2 rounded font-bold">-1</button>
                                <button onclick="adjustScore('home', 1)" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold">+1</button>
                                ${matchState.sport === 'basketball' ? `<button onclick="adjustScore('home', 2)" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold">+2</button><button onclick="adjustScore('home', 3)" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold">+3</button>` : ''}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-gray-900 p-2 rounded text-center">
                                <label class="text-gray-400 text-xs font-bold block mb-1">Sets / Games</label>
                                <div class="flex items-center justify-center gap-2">
                                    <button onclick="adjustSet('home', -1)" class="bg-gray-700 px-2 rounded">-</button>
                                    <span class="text-xl font-bold">${matchState.home.sets}</span>
                                    <button onclick="adjustSet('home', 1)" class="bg-gray-700 px-2 rounded">+</button>
                                </div>
                            </div>
                            <div class="bg-gray-900 p-2 rounded text-center ${isNoTimerSport ? 'opacity-30 pointer-events-none' : ''}">
                                <label class="text-gray-400 text-xs font-bold block mb-1">Fouls</label>
                                <input id="input-home-fouls" type="number" class="w-full bg-gray-700 rounded p-1 text-center font-bold" value="${matchState.home.fouls}">
                            </div>
                        </div>
                    </div>

                    <!-- CENTER (Timer & Period) -->
                    <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-lg flex flex-col gap-4 items-center">
                        <div class="w-full bg-gray-900 p-3 rounded text-center">
                            <label class="text-gray-400 text-xs font-bold block mb-1">Period / Quarter / Set</label>
                            <input id="input-period" type="text" class="bg-gray-700 rounded p-2 text-center w-32 font-bold text-2xl mx-auto" value="${matchState.period}">
                        </div>
                        
                        <div class="w-full bg-gray-900 p-4 rounded text-center flex-1 flex flex-col justify-center ${isNoTimerSport ? 'opacity-30 pointer-events-none' : ''}">
                            <label class="text-gray-400 text-xs font-bold block mb-2">Main Timer (MM:SS)</label>
                            <input id="input-timer" type="text" class="bg-black text-yellow-400 rounded p-2 text-center text-5xl font-mono w-full border border-gray-700 tracking-widest" value="${matchState.timer.time}">
                            
                            ${matchState.sport === 'basketball' ? `
                            <div class="mt-6 border-t border-gray-700 pt-4">
                                <label class="text-red-400 text-xs font-bold block mb-2">Shot Clock</label>
                                <input id="input-shotclock" type="text" class="bg-black text-red-500 rounded p-2 text-center text-4xl font-mono w-32 mx-auto border border-red-900" value="${matchState.timer.shotClock}">
                            </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- AWAY TEAM -->
                    <div class="bg-gray-800 p-4 rounded-lg border-t-4 shadow-lg flex flex-col gap-4" style="border-color: ${matchState.away.color}">
                        <div class="text-center font-bold text-lg border-b border-gray-700 pb-2" style="color: ${matchState.away.color}">AWAY TEAM</div>
                        <input id="input-away-name" type="text" class="bg-gray-700 rounded p-2 text-center font-bold text-xl" value="${matchState.away.name}">
                        <div class="flex items-center justify-between">
                            <label class="text-gray-400 text-xs font-bold">Team Color:</label>
                            <input id="input-away-color" type="color" value="${matchState.away.color}" class="bg-gray-700 h-8 w-16 cursor-pointer rounded">
                        </div>
                        <div class="flex-1 flex flex-col justify-center items-center bg-gray-900 rounded-lg p-4">
                            <div class="text-6xl font-bold mb-4">${matchState.away.score}</div>
                            <div class="flex gap-2 flex-wrap justify-center">
                                <button onclick="adjustScore('away', -1)" class="bg-red-900 hover:bg-red-700 px-4 py-2 rounded font-bold">-1</button>
                                <button onclick="adjustScore('away', 1)" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold">+1</button>
                                ${matchState.sport === 'basketball' ? `<button onclick="adjustScore('away', 2)" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold">+2</button><button onclick="adjustScore('away', 3)" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold">+3</button>` : ''}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-gray-900 p-2 rounded text-center">
                                <label class="text-gray-400 text-xs font-bold block mb-1">Sets / Games</label>
                                <div class="flex items-center justify-center gap-2">
                                    <button onclick="adjustSet('away', -1)" class="bg-gray-700 px-2 rounded">-</button>
                                    <span class="text-xl font-bold">${matchState.away.sets}</span>
                                    <button onclick="adjustSet('away', 1)" class="bg-gray-700 px-2 rounded">+</button>
                                </div>
                            </div>
                            <div class="bg-gray-900 p-2 rounded text-center ${isNoTimerSport ? 'opacity-30 pointer-events-none' : ''}">
                                <label class="text-gray-400 text-xs font-bold block mb-1">Fouls</label>
                                <input id="input-away-fouls" type="number" class="w-full bg-gray-700 rounded p-1 text-center font-bold" value="${matchState.away.fouls}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // --- 2. LED DISPLAY PANEL ---
        function renderDisplayPanel() {
            const isNoTimerSport = ['volleyball', 'badminton', 'takraw'].includes(matchState.sport);
            
            return `
            <div class="display-screen w-full max-w-[1400px] relative rounded-lg p-6">
                <!-- Header -->
                <div class="text-center bg-black bg-opacity-60 p-2 rounded-lg border border-gray-800 mx-auto w-4/5 mb-2 shadow-lg">
                    <h1 class="text-4xl text-yellow-400 led-text font-bold tracking-widest uppercase">${matchState.competitionName}</h1>
                    <h2 class="text-2xl text-gray-300 mt-1 uppercase">PERIOD / SET: ${matchState.period}</h2>
                </div>

                <!-- Main Score Area -->
                <div class="flex justify-between items-stretch flex-1 w-full px-8 gap-8 mt-4">
                    
                    <!-- Home Team -->
                    <div class="flex-1 bg-black bg-opacity-70 p-6 rounded-2xl border-l-[12px] flex flex-col items-center justify-between shadow-2xl relative" style="border-color: ${matchState.home.color}">
                        <div class="text-5xl font-bold text-white led-text truncate w-full text-center tracking-wide uppercase">${matchState.home.name}</div>
                        <div class="text-[16rem] leading-none font-bold led-text my-auto" style="color: ${matchState.home.color}">${matchState.home.score}</div>
                        ${!isNoTimerSport ? `<div class="text-4xl text-red-500 led-text font-bold bg-gray-900 px-6 py-2 rounded-lg">FOULS: ${matchState.home.fouls}</div>` : ''}
                    </div>

                    <!-- Center Area -->
                    <div class="flex flex-col items-center justify-center w-1/4">
                        ${isNoTimerSport ? `
                            <!-- Layout สำหรับ วอลเลย์บอล / แบดมินตัน (ไม่มีเวลา, เน้นเซ็ต) -->
                            <div class="bg-black bg-opacity-80 p-8 rounded-2xl border border-gray-700 w-full text-center shadow-2xl">
                                <div class="text-4xl text-yellow-400 led-text mb-6 tracking-widest">SETS</div>
                                <div class="flex justify-center items-center gap-6">
                                    <div class="text-[8rem] leading-none font-bold text-white led-text">${matchState.home.sets}</div>
                                    <div class="text-6xl font-bold text-gray-600">-</div>
                                    <div class="text-[8rem] leading-none font-bold text-white led-text">${matchState.away.sets}</div>
                                </div>
                            </div>
                        ` : `
                            <!-- Layout สำหรับ บาส / ฟุตบอล / ฟุตซอล (มีเวลา) -->
                            <div class="text-3xl text-gray-400 mb-2 font-bold tracking-widest">TIME</div>
                            <div class="text-[7rem] leading-none font-mono font-bold text-yellow-400 led-text bg-black bg-opacity-80 px-8 py-4 rounded-xl border border-gray-800 shadow-2xl">${matchState.timer.time}</div>
                            
                            ${matchState.sport === 'basketball' ? `
                            <div class="mt-12 mb-2 text-2xl text-red-400 font-bold tracking-widest">SHOT CLOCK</div>
                            <div class="text-[8rem] leading-none font-mono font-bold text-red-500 led-text bg-black bg-opacity-80 px-8 py-2 rounded-xl border-4 border-red-900 shadow-2xl">${matchState.timer.shotClock}</div>
                            ` : `
                            <div class="mt-12 text-2xl text-yellow-400 font-bold tracking-widest">SETS</div>
                            <div class="text-6xl font-bold text-white led-text bg-black bg-opacity-60 px-8 py-4 rounded-lg mt-2">${matchState.home.sets} - ${matchState.away.sets}</div>
                            `}
                        `}
                    </div>

                    <!-- Away Team -->
                    <div class="flex-1 bg-black bg-opacity-70 p-6 rounded-2xl border-r-[12px] flex flex-col items-center justify-between shadow-2xl relative" style="border-color: ${matchState.away.color}">
                        <div class="text-5xl font-bold text-white led-text truncate w-full text-center tracking-wide uppercase">${matchState.away.name}</div>
                        <div class="text-[16rem] leading-none font-bold led-text my-auto" style="color: ${matchState.away.color}">${matchState.away.score}</div>
                        ${!isNoTimerSport ? `<div class="text-4xl text-red-500 led-text font-bold bg-gray-900 px-6 py-2 rounded-lg">FOULS: ${matchState.away.fouls}</div>` : ''}
                    </div>
                </div>

                <!-- Marquee -->
                ${matchState.marquee.visible ? `
                <div class="marquee-container mt-6 rounded-lg shadow-lg">
                    <div class="marquee-content text-yellow-300 led-text">${matchState.marquee.text}</div>
                </div>
                ` : '<div class="h-[46px] mt-6"></div>'}
            </div>`;
        }

        // --- 3. EVENT LISTENERS สำหรับ Control Panel ---
        function attachControlListeners() {
            if (currentView !== 'control') return;
            
            // Map ID ของ input เข้ากับ Object State
            const bindings = [
                { id: 'input-sport', key: 'sport' },
                { id: 'input-comp', key: 'competitionName' },
                { id: 'input-marquee', key: 'marquee', subKey: 'text' },
                { id: 'input-period', key: 'period' },
                { id: 'input-timer', key: 'timer', subKey: 'time' },
                { id: 'input-shotclock', key: 'timer', subKey: 'shotClock' },
                { id: 'input-home-name', key: 'home', subKey: 'name' },
                { id: 'input-home-color', key: 'home', subKey: 'color' },
                { id: 'input-home-fouls', key: 'home', subKey: 'fouls' },
                { id: 'input-away-name', key: 'away', subKey: 'name' },
                { id: 'input-away-color', key: 'away', subKey: 'color' },
                { id: 'input-away-fouls', key: 'away', subKey: 'fouls' },
            ];

            bindings.forEach(b => {
                const el = document.getElementById(b.id);
                if (el) {
                    el.addEventListener('change', (e) => {
                        let val = e.target.value;
                        if (e.target.type === 'number') val = parseInt(val) || 0;
                        updateState(b.key, b.subKey, val);
                    });
                }
            });

            // จัดการ Checkbox แยกต่างหาก
            const marqueeVisibleCheckbox = document.getElementById('input-marquee-visible');
            if (marqueeVisibleCheckbox) {
                marqueeVisibleCheckbox.addEventListener('change', (e) => {
                    updateState('marquee', 'visible', e.target.checked);
                });
            }
        }

        // Render ครั้งแรกตอนโหลด
        renderApp();
    </script>
</body>
</html>
