<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium LED Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap');
        
        :root {
            --led-glow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Teko', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden; /* ป้องกัน Scrollbar สำหรับ Control Panel */
        }

        .led-text {
            text-shadow: var(--led-glow);
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            background: linear-gradient(90deg, #111, #333, #111);
            border-top: 2px solid #555;
            padding: 5px 0;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* 16:9 Display Aspect Ratio */
        .display-screen {
            aspect-ratio: 16 / 9;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) inset;
        }

        /* ปรับแต่ง Scrollbar ใน Control Panel ให้เล็กที่สุดถ้าจำเป็น */
        .control-panel {
            height: calc(100vh - 50px); /* ลบความสูงของ Nav */
            overflow-y: auto;
        }
        .control-panel::-webkit-scrollbar { width: 6px; }
        .control-panel::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Navigation -->
    <nav class="bg-gray-800 p-2 flex justify-between items-center h-[50px] shadow-lg border-b border-gray-700">
        <div class="font-bold text-2xl text-yellow-400 tracking-wider"><i class="fas fa-desktop"></i> STADIUM UI</div>
        <div class="flex gap-4">
            <button onclick="switchView('control')" class="px-4 py-1 bg-blue-600 hover:bg-blue-500 rounded text-lg transition">Control Panel</button>
            <button onclick="switchView('display')" class="px-4 py-1 bg-green-600 hover:bg-green-500 rounded text-lg transition">LED Display</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div id="app" class="w-full"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // *** ใส่ Config ของคุณที่นี่ ***
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const matchRef = ref(db, 'currentMatch');

        // State เริ่มต้น
        let matchState = {
            competitionName: "CHAMPIONSHIP FINALS 2026",
            sport: "basketball", // basketball, football, futsal, volleyball, badminton, takraw
            period: 1,
            timer: { time: "10:00", shotClock: "24", running: false },
            home: { name: "HOME TEAM", score: 0, sets: 0, color: "#1d4ed8", fouls: 0, logo: "" },
            away: { name: "AWAY TEAM", score: 0, sets: 0, color: "#b91c1c", fouls: 0, logo: "" },
            marquee: { text: "WELCOME TO THE CHAMPIONSHIP FINALS | SPONSORED BY YOUR BRAND", visible: true },
            matchEvent: { text: "", teamInfo: "", timestamp: 0 }
        };

        let currentView = 'control'; // 'control' หรือ 'display'
        let localTimerInterval = null;

        // ฟังก์ชันสำหรับสลับหน้าจอ (เปิดในหน้าต่างใหม่ได้โดยตรงผ่าน URL param แต่ที่นี่ใช้ JS สลับ)
        window.switchView = (view) => {
            currentView = view;
            renderApp();
        };

        // ผูกฟังก์ชัน Global
        window.updateState = (key, subKey, value) => {
            if(subKey) {
                matchState[key][subKey] = value;
            } else {
                matchState[key] = value;
            }
            syncToFirebase();
            renderApp();
        };

        window.adjustScore = (team, amount) => {
            matchState[team].score = Math.max(0, matchState[team].score + amount);
            syncToFirebase();
            triggerEvent(team, amount > 0 ? "SCORED!" : "SCORE CORRECTED");
        };

        window.triggerEvent = (team, text) => {
            matchState.matchEvent = {
                text: text,
                teamInfo: matchState[team].name,
                timestamp: Date.now()
            };
            syncToFirebase();
            renderApp();
        };

        // Firebase Sync
        function syncToFirebase() {
            set(matchRef, matchState);
        }

        onValue(matchRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                matchState = data;
                renderApp();
            }
        });

        // ==========================
        // RENDER LOGIC
        // ==========================
        function renderApp() {
            const appDiv = document.getElementById('app');
            if (currentView === 'control') {
                appDiv.innerHTML = renderControlPanel();
            } else {
                appDiv.innerHTML = renderDisplayPanel();
            }
            attachControlListeners();
        }

                <div class="grid grid-cols-12 gap-2 mb-2 bg-gray-800 p-2 rounded border border-gray-700">
                    <div class="col-span-3 flex flex-col">

                        <select id="input-sport" class="bg-gray-700 text-white rounded p-1">

                        </select>
                    </div>
                    <div class="col-span-4 flex flex-col">
                        <label class="text-gray-400 text-xs">Competition Name</label>

                    </div>
                    <div class="col-span-5 flex flex-col">
                        <div class="flex justify-between items-center">
                            <label class="text-gray-400 text-xs">Marquee Text</label>
                            <label class="flex items-center gap-1 text-xs cursor-pointer">
                                <input type="checkbox" id="input-marquee-visible" ${matchState.marquee.visible ? 'checked' : ''}>
                                Show Marquee
                            </label>
                        </div>
                        <input id="input-marquee" type="text" class="bg-gray-700 text-white rounded p-1" value="${matchState.marquee.text}">
                    </div>

                <div class="grid grid-cols-3 gap-2 h-full">
                    
                    <!-- HOME TEAM -->
                    <div class="bg-gray-800 p-2 rounded border-t-4 border-blue-600 flex flex-col gap-2">
                        <div class="text-center font-bold text-blue-400 text-lg border-b border-gray-700 pb-1">HOME TEAM</div>
                        <input id="input-home-name" type="text" class="bg-gray-700 rounded p-1 text-center font-bold" value="${matchState.home.name}">
                        <div class="flex items-center justify-between mt-1">

                            <input id="input-home-color" type="color" value="${matchState.home.color}" class="bg-gray-700 h-6 w-12 cursor-pointer">

                        <div class="flex-1 flex flex-col justify-center items-center mt-2">

                                <button onclick="adjustScore('home', 1)" class="bg-green-700 hover:bg-green-600 px-4 py-1 rounded text-xl">+1</button>
                                <button onclick="adjustScore('home', 2)" class="bg-green-700 hover:bg-green-600 px-4 py-1 rounded text-xl">+2</button>
                                ${matchState.sport === 'basketball' ? `<button onclick="adjustScore('home', 3)" class="bg-green-700 hover:bg-green-600 px-4 py-1 rounded text-xl">+3</button>` : ''}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <div>
                                <label class="text-gray-400 text-xs block text-center">Sets</label>
                                <input id="input-home-sets" type="number" class="w-full bg-gray-700 rounded p-1 text-center" value="${matchState.home.sets}">
                            </div>
                            <div>
                                <label class="text-gray-400 text-xs block text-center">Fouls</label>
                                <input id="input-home-fouls" type="number" class="w-full bg-gray-700 rounded p-1 text-center" value="${matchState.home.fouls}">
                            </div>
                        </div>
                    </div>

                    <!-- CENTER (Timer & Period) -->
                    <div class="bg-gray-800 p-2 rounded border border-gray-700 flex flex-col gap-2 items-center text-center">
                        <label class="text-gray-400 text-xs">Period / Quarter / Half</label>
                        <input id="input-period" type="text" class="bg-gray-700 rounded p-1 text-center w-24 font-bold text-xl" value="${matchState.period}">
                        
                        <label class="text-gray-400 text-xs mt-2">Main Timer</label>
                        <input id="input-timer" type="text" class="bg-gray-700 rounded p-2 text-center text-3xl font-mono w-full" value="${matchState.timer.time}">
                        
                        <div class="w-full flex flex-col mt-2">
                            ${matchState.sport === 'basketball' ? `
                            <label class="text-red-400 text-xs font-bold mt-2">Shot Clock</label>
                            <input id="input-shotclock" type="text" class="bg-gray-700 rounded p-1 text-center text-2xl text-red-500 font-mono w-full mb-2" value="${matchState.timer.shotClock}">
                            ` : ''}
                        </div>
                    </div>

                    <!-- AWAY TEAM -->
                    <div class="bg-gray-800 p-2 rounded border-t-4 border-red-600 flex flex-col gap-2">
                        <div class="text-center font-bold text-red-400 text-lg border-b border-gray-700 pb-1">AWAY TEAM</div>
                        <input id="input-away-name" type="text" class="bg-gray-700 rounded p-1 text-center font-bold" value="${matchState.away.name}">
                        <div class="flex items-center justify-between mt-1">
                            <label class="text-gray-400 text-xs">Color:</label>
                            <input id="input-away-color" type="color" value="${matchState.away.color}" class="bg-gray-700 h-6 w-12 cursor-pointer">
                        </div>
                        <div class="flex-1 flex flex-col justify-center items-center mt-2">
                            <div class="text-5xl font-bold mb-2">${matchState.away.score}</div>
                            <div class="flex gap-2">
                                <button onclick="adjustScore('away', -1)" class="bg-red-900 hover:bg-red-700 px-4 py-1 rounded text-xl">-1</button>
                                <button onclick="adjustScore('away', 1)" class="bg-green-700 hover:bg-green-600 px-4 py-1 rounded text-xl">+1</button>
                                <button onclick="adjustScore('away', 2)" class="bg-green-700 hover:bg-green-600 px-4 py-1 rounded text-xl">+2</button>
                                ${matchState.sport === 'basketball' ? `<button onclick="adjustScore('away', 3)" class="bg-green-700 hover:bg-green-600 px-4 py-1 rounded text-xl">+3</button>` : ''}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <div>
                                <label class="text-gray-400 text-xs block text-center">Sets</label>
                                <input id="input-away-sets" type="number" class="w-full bg-gray-700 rounded p-1 text-center" value="${matchState.away.sets}">
                            </div>
                            <div>
                                <label class="text-gray-400 text-xs block text-center">Fouls</label>
                                <input id="input-away-fouls" type="number" class="w-full bg-gray-700 rounded p-1 text-center" value="${matchState.away.fouls}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // ดักจับการเปลี่ยนแปลงค่าใน Control Panel
        function attachControlListeners() {
            if (currentView !== 'control') return;

                { id: 'input-home-name', key: 'home', subKey: 'name' },

                { id: 'input-home-fouls', key: 'home', subKey: 'fouls' },
