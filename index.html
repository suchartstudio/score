<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Scoreboard System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap');
        body { font-family: 'Chakra Petch', sans-serif; background-color: #0f172a; color: white; }
        .digital-font { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ==========================================
         CONTROL PANEL (แผงควบคุม)
         ========================================== -->
    <div id="control-panel" class="p-6 max-w-5xl mx-auto w-full space-y-6 bg-slate-900 border-b border-slate-700">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-amber-400">⚙️ Control Panel</h1>
            <button onclick="openDisplay()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-bold">🖥️ เปิดหน้าจอ Display (New Tab)</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">เลือกกีฬา</label>
                <select id="ctrl-sport" class="w-full p-2 bg-slate-800 rounded" onchange="updateSportMode()">
                    <option value="football">⚽ ฟุตบอล</option>
                    <option value="futsal">⚽ ฟุตซอล</option>
                    <option value="basketball">🏀 บาสเก็ตบอล</option>
                    <option value="volleyball">🏐 วอลเลย์บอล</option>
                    <option value="badminton">🏸 แบดมินตัน</option>
                </select>
            </div>
            <div class="col-span-3">
                <label class="block text-sm text-slate-400 mb-1">ชื่อการแข่งขัน (แสดงกลางจอ)</label>
                <input type="text" id="ctrl-comp-name" class="w-full p-2 bg-slate-800 rounded" placeholder="CHAMPIONSHIP 2026" oninput="syncState()">
            </div>
        </div>

        <!-- Timer Controls -->
        <div class="bg-slate-800 p-4 rounded-lg flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-sm text-slate-400 mb-1">เซ็ต / ควอเตอร์ / ครึ่งเวลา</label>
                <input type="text" id="ctrl-period" class="w-full p-2 bg-slate-700 rounded text-center font-bold" value="1st Half" oninput="syncState()">
            </div>
            
            <div class="border-l border-slate-600 pl-4 flex gap-2 items-end">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">ปรับเวลาแบบ Manual</label>
                    <div class="flex gap-2">
                        <input type="number" id="ctrl-min" class="w-16 p-2 bg-slate-700 rounded text-center" placeholder="นาที">
                        <span class="text-xl font-bold">:</span>
                        <input type="number" id="ctrl-sec" class="w-16 p-2 bg-slate-700 rounded text-center" placeholder="วิ">
                    </div>
                </div>
                <button onclick="setManualTime()" class="bg-amber-500 text-black px-4 py-2 rounded font-bold hover:bg-amber-400">Set เวลา</button>
            </div>

            <div class="border-l border-slate-600 pl-4 flex gap-2 items-end">
                <button id="btn-timer" onclick="toggleTimer()" class="bg-emerald-600 px-6 py-2 rounded font-bold hover:bg-emerald-500">START</button>
                <button onclick="resetTimer()" class="bg-red-600 px-4 py-2 rounded font-bold hover:bg-red-500">RESET</button>
            </div>

            <!-- Basketball Shot Clock -->
            <div id="ctrl-shotclock-box" class="hidden border-l border-slate-600 pl-4 flex gap-2 items-end">
                <button onclick="resetShotClock(24)" class="bg-red-700 px-3 py-2 rounded font-bold text-sm">24s</button>
                <button onclick="resetShotClock(14)" class="bg-red-700 px-3 py-2 rounded font-bold text-sm">14s</button>
            </div>
        </div>

        <!-- Scores -->
        <div class="grid grid-cols-2 gap-8 text-center">
            <div class="bg-slate-800 p-4 rounded-lg">
                <input type="text" id="ctrl-home-name" class="w-full p-2 bg-slate-700 rounded text-center font-bold text-xl mb-4" value="HOME" oninput="syncState()">
                <div class="flex justify-center gap-4">
                    <button onclick="changeScore('home', -1)" class="bg-slate-600 px-4 py-2 rounded font-bold text-2xl">-</button>
                    <span id="ctrl-home-score" class="text-5xl font-bold">0</span>
                    <button onclick="changeScore('home', 1)" class="bg-emerald-600 px-4 py-2 rounded font-bold text-2xl">+</button>
                </div>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg">
                <input type="text" id="ctrl-away-name" class="w-full p-2 bg-slate-700 rounded text-center font-bold text-xl mb-4" value="AWAY" oninput="syncState()">
                <div class="flex justify-center gap-4">
                    <button onclick="changeScore('away', -1)" class="bg-slate-600 px-4 py-2 rounded font-bold text-2xl">-</button>
                    <span id="ctrl-away-score" class="text-5xl font-bold">0</span>
                    <button onclick="changeScore('away', 1)" class="bg-emerald-600 px-4 py-2 rounded font-bold text-2xl">+</button>
                </div>
            </div>
        </div>

        <!-- Football/Futsal Events -->
        <div id="ctrl-events-box" class="bg-slate-800 p-4 rounded-lg hidden">
            <h3 class="text-amber-400 font-bold mb-2">บันทึกเหตุการณ์ (ใบเหลือง / ใบแดง / ผู้ทำประตู)</h3>
            <div class="flex gap-4">
                <select id="event-team" class="p-2 bg-slate-700 rounded"><option value="home">Home</option><option value="away">Away</option></select>
                <select id="event-type" class="p-2 bg-slate-700 rounded">
                    <option value="⚽ Goal">⚽ ทำประตู</option>
                    <option value="🟨 Yellow Card">🟨 ใบเหลือง</option>
                    <option value="🟥 Red Card">🟥 ใบแดง</option>
                </select>
                <input type="text" id="event-player" class="p-2 bg-slate-700 rounded flex-1" placeholder="ชื่อนักกีฬา / หมายเลข">
                <button onclick="addEvent()" class="bg-blue-600 px-4 py-2 rounded font-bold text-sm">บันทึก</button>
                <button onclick="clearEvents()" class="bg-slate-600 px-4 py-2 rounded font-bold text-sm">ล้าง</button>
            </div>
        </div>

        <!-- Volleyball/Badminton Sets -->
        <div id="ctrl-sets-box" class="bg-slate-800 p-4 rounded-lg hidden flex gap-4 items-center justify-center">
            <button onclick="saveSet()" class="bg-emerald-600 px-6 py-2 rounded font-bold text-lg">📌 บันทึกคะแนนจบเซ็ตนี้</button>
            <button onclick="clearSets()" class="bg-red-600 px-4 py-2 rounded font-bold">เริ่มแข่งใหม่ (ล้างเซ็ต)</button>
        </div>
    </div>

    <!-- ==========================================
         DISPLAY SCREEN (หน้าจอแสดงผล)
         ========================================== -->
    <div id="display-screen" class="flex-1 bg-black flex flex-col justify-center items-center p-8 relative overflow-hidden hidden">
        
        <!-- Center Competition Name (ข้อ 5) -->
        <div id="disp-comp-name" class="absolute top-6 w-full text-center text-4xl font-bold tracking-wider text-slate-300 uppercase z-10">
            CHAMPIONSHIP 2026
        </div>

        <div class="flex w-full max-w-7xl justify-between items-center z-20 mt-12 gap-8">
            
            <!-- Home -->
            <div class="flex-1 bg-slate-900/80 p-8 rounded-3xl border-4 border-slate-800 text-center shadow-2xl relative">
                <div id="disp-home-name" class="text-6xl font-bold mb-6 text-white break-words">HOME</div>
                <div id="disp-home-score" class="text-[12rem] font-bold leading-none text-emerald-400 digital-font drop-shadow-[0_0_15px_rgba(52,211,99,0.8)]">0</div>
            </div>

            <!-- Center Data -->
            <div class="flex flex-col items-center justify-center w-[400px] shrink-0 gap-6">
                <!-- Period/Set Text above Score (ข้อ 6) -->
                <div id="disp-period" class="text-4xl font-bold bg-amber-500 text-black px-6 py-2 rounded-xl text-center w-full shadow-lg">1ST HALF</div>
                
                <div class="relative w-full text-center">
                    <div id="disp-timer" class="text-8xl font-bold text-amber-400 bg-slate-900/90 py-4 rounded-2xl border-4 border-slate-700 digital-font drop-shadow-[0_0_15px_rgba(251,191,36,0.6)]">00:00</div>
                    <!-- Basketball 24s Clock (ข้อ 4) -->
                    <div id="disp-shotclock" class="hidden absolute -bottom-8 right-0 bg-red-600 text-white border-4 border-white text-5xl font-bold px-4 py-2 rounded shadow-2xl digital-font z-30">24</div>
                </div>

                <!-- Volleyball/Badminton Sets Table (ข้อ 2) -->
                <div id="disp-sets-table" class="hidden w-full bg-slate-900/90 border-2 border-slate-600 rounded-xl p-4 shadow-xl">
                    <div class="text-sm text-slate-400 mb-2 text-center uppercase font-bold tracking-widest">Previous Sets</div>
                    <div id="disp-sets-content" class="flex justify-center gap-4 text-2xl font-bold text-white flex-wrap">
                        <!-- Gen by JS -->
                    </div>
                </div>
            </div>

            <!-- Away -->
            <div class="flex-1 bg-slate-900/80 p-8 rounded-3xl border-4 border-slate-800 text-center shadow-2xl relative">
                <div id="disp-away-name" class="text-6xl font-bold mb-6 text-white break-words">AWAY</div>
                <div id="disp-away-score" class="text-[12rem] font-bold leading-none text-emerald-400 digital-font drop-shadow-[0_0_15px_rgba(52,211,99,0.8)]">0</div>
            </div>
        </div>

        <!-- Event Popup (ข้อ 1) -->
        <div id="disp-event-popup" class="hidden absolute bottom-12 bg-blue-900/95 border-l-8 border-amber-400 text-white px-8 py-4 rounded-r-xl shadow-2xl text-4xl font-bold transition-all duration-500 z-50">
            <span id="disp-event-text"></span>
        </div>
    </div>

    <script>
        // --- State Management ---
        let state = {
            sport: 'football', compName: '', homeName: 'HOME', awayName: 'AWAY',
            homeScore: 0, awayScore: 0, period: '1st Half',
            timerSec: 0, isRunning: false, shotClockSec: 24,
            sets: [], // [{h: 25, a: 23}]
            lastEvent: null
        };
        let timerInterval = null;
        let eventTimeout = null;
        const isDisplayMode = new URLSearchParams(window.location.search).get('mode') === 'display';

        // --- Init ---
        if (isDisplayMode) {
            document.getElementById('control-panel').classList.add('hidden');
            document.getElementById('display-screen').classList.remove('hidden');
            document.getElementById('display-screen').classList.add('flex');
            setInterval(loadState, 200); // Sync from LocalStorage for display
        } else {
            document.getElementById('display-screen').classList.remove('hidden');
            document.getElementById('display-screen').classList.add('flex');
            updateSportMode(); // Init control panel UI
        }

        function syncState() {
            if (isDisplayMode) return;
            state.compName = document.getElementById('ctrl-comp-name').value;
            state.homeName = document.getElementById('ctrl-home-name').value;
            state.awayName = document.getElementById('ctrl-away-name').value;
            state.period = document.getElementById('ctrl-period').value;
            localStorage.setItem('sb_state', JSON.stringify(state));
            updateDisplay();
        }

        function loadState() {
            const saved = localStorage.getItem('sb_state');
            if (saved) {
                const newState = JSON.parse(saved);
                state = newState;
                updateDisplay();
            }
        }

        // --- Core Functions ---
        function updateSportMode() {
            state.sport = document.getElementById('ctrl-sport').value;
            
            // Toggle Panels based on sport
            document.getElementById('ctrl-events-box').classList.add('hidden');
            document.getElementById('ctrl-sets-box').classList.add('hidden');
            document.getElementById('ctrl-shotclock-box').classList.add('hidden');

            if (state.sport === 'football' || state.sport === 'futsal') document.getElementById('ctrl-events-box').classList.remove('hidden'); // ข้อ 1
            if (state.sport === 'volleyball' || state.sport === 'badminton') document.getElementById('ctrl-sets-box').classList.remove('hidden');
            if (state.sport === 'basketball') document.getElementById('ctrl-shotclock-box').classList.remove('hidden');

            syncState();
        }

        function changeScore(team, amount) {
            if (team === 'home') state.homeScore = Math.max(0, state.homeScore + amount);
            if (team === 'away') state.awayScore = Math.max(0, state.awayScore + amount);
            syncState();
            updateControlUI();
        }

        // --- Timer Functions ---
        function toggleTimer() {
            state.isRunning = !state.isRunning;
            document.getElementById('btn-timer').innerText = state.isRunning ? "PAUSE" : "START";
            document.getElementById('btn-timer').className = state.isRunning ? "bg-amber-600 px-6 py-2 rounded font-bold" : "bg-emerald-600 px-6 py-2 rounded font-bold";
            
            if (state.isRunning) {
                timerInterval = setInterval(() => {
                    // ข้อ 4: บาสเก็ตบอลนับถอยหลัง
                    if (state.sport === 'basketball') {
                        if (state.timerSec > 0) state.timerSec--;
                        if (state.shotClockSec > 0) state.shotClockSec--;
                    } else {
                        state.timerSec++;
                    }
                    syncState();
                    updateControlUI();
                }, 1000);
            } else {
                clearInterval(timerInterval);
                syncState();
            }
        }

        function resetTimer() {
            state.timerSec = 0; state.shotClockSec = 24; state.isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('btn-timer').innerText = "START";
            document.getElementById('btn-timer').className = "bg-emerald-600 px-6 py-2 rounded font-bold";
            syncState(); updateControlUI();
        }

        function setManualTime() { // ข้อ 3
            const m = parseInt(document.getElementById('ctrl-min').value) || 0;
            const s = parseInt(document.getElementById('ctrl-sec').value) || 0;
            state.timerSec = (m * 60) + s;
            document.getElementById('ctrl-min').value = '';
            document.getElementById('ctrl-sec').value = '';
            syncState(); updateControlUI();
        }

        function resetShotClock(sec) {
            state.shotClockSec = sec;
            syncState(); updateControlUI();
        }

        // --- Events & Sets ---
        function addEvent() {
            const team = document.getElementById('event-team').value;
            const type = document.getElementById('event-type').value;
            const player = document.getElementById('event-player').value;
            const teamName = team === 'home' ? state.homeName : state.awayName;
            state.lastEvent = { text: `${type} : ${player} (${teamName})`, ts: Date.now() };
            document.getElementById('event-player').value = '';
            syncState();
        }
        function clearEvents() { state.lastEvent = null; syncState(); }

        function saveSet() {
            state.sets.push({ h: state.homeScore, a: state.awayScore });
            state.homeScore = 0; state.awayScore = 0;
            state.period = `Set ${state.sets.length + 1}`;
            syncState(); updateControlUI();
        }
        function clearSets() { state.sets = []; state.homeScore = 0; state.awayScore = 0; state.period = 'Set 1'; syncState(); updateControlUI(); }

        function openDisplay() {
            window.open(window.location.pathname + '?mode=display', 'ScoreboardDisplay', 'width=1280,height=720');
        }

        // --- Update UI ---
        function updateControlUI() {
            document.getElementById('ctrl-home-score').innerText = state.homeScore;
            document.getElementById('ctrl-away-score').innerText = state.awayScore;
            document.getElementById('ctrl-period').value = state.period;
        }

        let lastEventRendered = null;
        function updateDisplay() {
            // Text
            document.getElementById('disp-comp-name').innerText = state.compName; // ข้อ 5
            document.getElementById('disp-home-name').innerText = state.homeName;
            document.getElementById('disp-away-name').innerText = state.awayName;
            document.getElementById('disp-home-score').innerText = state.homeScore;
            document.getElementById('disp-away-score').innerText = state.awayScore;
            document.getElementById('disp-period').innerText = state.period; // ข้อ 6 (ย้ายขึ้นไปเหนือเวลา/คะแนนแล้วใน HTML)

            // Timer
            const m = String(Math.floor(state.timerSec / 60)).padStart(2, '0');
            const s = String(state.timerSec % 60).padStart(2, '0');
            document.getElementById('disp-timer').innerText = `${m}:${s}`;

            // Shotclock (ข้อ 4)
            const sc = document.getElementById('disp-shotclock');
            if (state.sport === 'basketball') {
                sc.innerText = state.shotClockSec;
                sc.classList.remove('hidden');
                // เปลี่ยนสีกรอบและตัวหนังสือตามโจทย์ (ขาวพื้นกรอบแดง) ถูกกำหนดใน HTML classes แล้ว
            } else {
                sc.classList.add('hidden');
            }

            // Sets Table (ข้อ 2)
            const table = document.getElementById('disp-sets-table');
            const content = document.getElementById('disp-sets-content');
            if ((state.sport === 'volleyball' || state.sport === 'badminton') && state.sets.length > 0) {
                table.classList.remove('hidden');
                content.innerHTML = state.sets.map((set, i) => 
                    `<div class="bg-slate-800 px-4 py-2 rounded border border-slate-600 shadow text-amber-400">
                        <span class="text-sm text-slate-400 block -mt-1 mb-1">Set ${i+1}</span>
                        ${set.h} - ${set.a}
                    </div>`
                ).join('');
            } else {
                table.classList.add('hidden');
            }

            // Event Popup (ข้อ 1)
            if (state.lastEvent && state.lastEvent.ts !== lastEventRendered) {
                lastEventRendered = state.lastEvent.ts;
                const popup = document.getElementById('disp-event-popup');
                document.getElementById('disp-event-text').innerText = state.lastEvent.text;
                popup.classList.remove('hidden');
                clearTimeout(eventTimeout);
                eventTimeout = setTimeout(() => { popup.classList.add('hidden'); }, 6000);
            } else if (!state.lastEvent) {
                document.getElementById('disp-event-popup').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
